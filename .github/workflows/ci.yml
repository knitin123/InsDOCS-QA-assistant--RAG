name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: Medical-Assistant---RAG-Application-main/server

jobs:
  test:
    name: Unit & API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Medical-Assistant---RAG-Application-main/server/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (offline, mocked Pinecone / embeddings / LLM)
        run: pytest -v

  integration:
    name: Live RAG smoke test
    needs: test
    # secrets are not exposed to pull requests from forks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PINECONE_INDEX_NAME: insightdocs-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Medical-Assistant---RAG-Application-main/server/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # skips cleanly if the repository secrets are not configured
      - name: Upload a PDF and query it end to end
        run: pytest -v -m integration -rs
